<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitCode — Treino</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080808; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Barlow', sans-serif; }
    .phone { width: 380px; min-height: 780px; background: #0d0d0d; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; padding: 32px 0 32px; border: 1.5px solid #1e1e1e; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 0 24px 20px; }
    .back-btn { width: 36px; height: 36px; border-radius: 10px; background: #141414; border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; cursor: pointer; text-decoration: none; }
    .screen-title { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 0.05em; flex: 1; }
    .btn-add-topo { width: 36px; height: 36px; border-radius: 10px; background: #E84000; border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; cursor: pointer; }
    .ex-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .ex-item { background: #111; border: 1px solid #1e1e1e; border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .ex-item:hover { border-color: #E8400050; background: #1a0f0a; }
    .ex-item.concluido { border-color: #2a5a2a; background: #0a1a0a; }
    .ex-name { font-size: 15px; font-weight: 600; color: #ddd; margin-bottom: 6px; }
    .ex-item.concluido .ex-name { color: #4caf50; }
    .ex-meta { display: flex; gap: 12px; }
    .ex-tag { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; }
    .ex-tag strong { color: #888; font-weight: 600; }
    .ex-arrow { color: #333; font-size: 22px; flex-shrink: 0; }
    .ex-check { color: #4caf50; font-size: 20px; flex-shrink: 0; }
    .btn-remover-ex { background: none; border: none; color: #333; font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0; transition: color 0.2s; }
    .btn-remover-ex:hover { color: #E84000; }
    .bottom-bar { padding: 16px 20px 0; display: flex; gap: 10px; }
    .btn-progresso { flex: 1; height: 48px; background: #141414; border: 1px solid #222; border-radius: 12px; font-size: 13px; color: #888; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .btn-registrar { flex: 2; height: 48px; background: #E84000; border: none; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; cursor: pointer; transition: background 0.2s; }
    .btn-registrar:hover { background: #cc3700; }
    .sucesso-msg { display: none; margin: 12px 20px 0; padding: 12px 16px; background: #0a1a0a; border: 1px solid #2a5a2a; border-radius: 10px; font-size: 13px; color: #4caf50; text-align: center; }

    /* POPUP SERIES */
    .overlay { display: none; position: fixed; inset: 0; background: #00000099; z-index: 100; align-items: flex-end; justify-content: center; }
    .overlay.aberto { display: flex; }
    .popup { width: 380px; background: #131313; border-radius: 24px 24px 0 0; padding: 24px 24px 36px; border: 1px solid #222; border-bottom: none; max-height: 85vh; overflow-y: auto; }
    .popup-handle { width: 40px; height: 4px; background: #2a2a2a; border-radius: 2px; margin: 0 auto 18px; }
    .popup-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .popup-ref { font-size: 11px; color: #555; margin-bottom: 18px; }
    .popup-ref span { color: #E84000; }
    .serie-row { background: #1a1a1a; border: 1px solid #222; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .serie-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #555; margin-bottom: 10px; }
    .serie-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-wrap { display: flex; flex-direction: column; gap: 5px; }
    .input-wrap label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #444; }
    .input-wrap input { height: 40px; background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: 'Barlow', sans-serif; color: #e0e0e0; outline: none; transition: border-color 0.2s; }
    .input-wrap input:focus { border-color: #E8400060; }
    .btn-confirmar { width: 100%; height: 48px; background: #E84000; border: none; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: #fff; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }

    /* OVERLAY BUSCA */
    .overlay2 { display: none; position: fixed; inset: 0; background: #00000099; z-index: 200; align-items: flex-end; justify-content: center; }
    .overlay2.aberto { display: flex; }
    .popup2 { width: 380px; background: #131313; border-radius: 24px 24px 0 0; padding: 24px 24px 36px; border: 1px solid #222; border-bottom: none; max-height: 85vh; display: flex; flex-direction: column; }
    .popup2-handle { width: 40px; height: 4px; background: #2a2a2a; border-radius: 2px; margin: 0 auto 18px; flex-shrink: 0; }
    .popup2-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 14px; flex-shrink: 0; }
    .busca-input { width: 100%; height: 44px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0 14px; font-size: 14px; color: #e0e0e0; font-family: 'Barlow', sans-serif; outline: none; margin-bottom: 14px; flex-shrink: 0; }
    .busca-input::placeholder { color: #444; }
    .grupos-scroll { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; flex-shrink: 0; }
    .grupo-btn { padding: 6px 14px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; font-size: 11px; color: #666; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .grupo-btn.ativo { background: #E8400020; border-color: #E84000; color: #E84000; }
    .resultados { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .resultado-item { background: #1a1a1a; border: 1px solid #222; border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: border-color 0.2s; }
    .resultado-item:hover { border-color: #E8400050; background: #1a0f0a; }
    .resultado-nome { font-size: 14px; font-weight: 600; color: #ddd; }
    .resultado-grupo { font-size: 10px; color: #555; margin-top: 2px; text-transform: uppercase; }
    .resultado-plus { font-size: 20px; color: #E84000; }
    .vazio-busca { font-size: 13px; color: #444; text-align: center; padding: 20px 0; }

    /* OVERLAY CONFIG EXERCICIO */
    .overlay3 { display: none; position: fixed; inset: 0; background: #00000099; z-index: 300; align-items: flex-end; justify-content: center; }
    .overlay3.aberto { display: flex; }
    .popup3 { width: 380px; background: #131313; border-radius: 24px 24px 0 0; padding: 24px 24px 36px; border: 1px solid #222; border-bottom: none; }
    .popup3-handle { width: 40px; height: 4px; background: #2a2a2a; border-radius: 2px; margin: 0 auto 18px; }
    .popup3-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .popup3-grupo { font-size: 10px; color: #E84000; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
    .popup-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <a class="back-btn" href="home.html">←</a>
      <div class="screen-title" id="titulo-treino">TREINO</div>
      <button class="btn-add-topo" id="btn-add-topo" style="display:none" onclick="abrirBusca()">+</button>
    </div>
    <div class="ex-list" id="lista-exercicios">
      <div style="color:#444; font-size:13px; padding:12px 4px;">Carregando exercícios...</div>
    </div>
    <div class="sucesso-msg" id="sucesso-msg">✓ Treino registrado com sucesso!</div>
    <div class="bottom-bar">
      <a class="btn-progresso" id="btn-progresso" href="progresso.html">📊 Progresso</a>
      <button class="btn-registrar" onclick="registrarTreino()">Registrar Treino</button>
    </div>
  </div>

  <!-- POPUP SÉRIES -->
  <div class="overlay" id="overlay" onclick="fecharPopup(event)">
    <div class="popup" id="popup-content">
      <div class="popup-handle"></div>
      <div class="popup-title" id="popup-nome">Exercício</div>
      <div class="popup-ref" id="popup-ref">Referência: <span id="popup-ref-val"></span></div>
      <div id="popup-series-container"></div>
      <button class="btn-confirmar" onclick="confirmarExercicio()">Confirmar</button>
    </div>
  </div>

  <!-- OVERLAY BUSCA EXERCICIO -->
  <div class="overlay2" id="overlay-busca" onclick="fecharBusca(event)">
    <div class="popup2">
      <div class="popup2-handle"></div>
      <div class="popup2-title">Adicionar Exercício</div>
      <input class="busca-input" type="text" id="campo-busca" placeholder="Digite para buscar..." oninput="buscar()" />
      <div class="grupos-scroll" id="grupos-scroll"></div>
      <div class="resultados" id="resultados"></div>
    </div>
  </div>

  <!-- OVERLAY CONFIG NOVO EXERCICIO -->
  <div class="overlay3" id="overlay-config">
    <div class="popup3">
      <div class="popup3-handle"></div>
      <div class="popup3-title" id="config-nome">Exercício</div>
      <div class="popup3-grupo" id="config-grupo"></div>
      <div class="popup-grid">
        <div class="input-wrap"><label>Séries</label><input type="number" id="config-series" value="3" min="1" /></div>
        <div class="input-wrap"><label>Carga (kg)</label><input type="number" id="config-carga" value="0" min="0" step="0.5" /></div>
        <div class="input-wrap"><label>Reps</label><input type="number" id="config-reps" value="12" min="1" /></div>
      </div>
      <button class="btn-confirmar" onclick="confirmarNovoExercicio()">Adicionar</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const treino = params.get('treino') || 'A';
    const treinoIdParam = params.get('treino_id');
    const id = localStorage.getItem('usuario_id');
    if (!id) window.location.href = 'index.html';

    const ehPersonalizado = !!treinoIdParam;

    let exerciciosCarregados = [];
    let exerciciosRegistrados = {};
    let exAtual = null;
    let treinoId = null;
    let catalogo = [];
    let grupoAtivo = 'Todos';
    let exSelecionado = null;

    if (treinoIdParam) {
      fetch(`${API}/treinos_por_id/${treinoIdParam}`)
        .then(r => r.json())
        .then(dados => {
          if (dados.length > 0 && dados[0].nome_treino) {
            document.getElementById('titulo-treino').textContent = dados[0].nome_treino.toUpperCase();
          }
        });
      document.getElementById('btn-add-topo').style.display = 'flex';
    } else {
      document.getElementById('titulo-treino').textContent = `TREINO ${treino}`;
    }

    document.getElementById('btn-progresso').href = `progresso.html?treino=${treino}`;

    async function carregarExercicios() {
      try {
        const url = treinoIdParam
          ? `${API}/treinos_por_id/${treinoIdParam}`
          : `${API}/treinos/${id}/${treino}`;
        const resp = await fetch(url);
        const dados = await resp.json();
        exerciciosCarregados = dados;
        renderExercicios();
        treinoId = dados[0]?.treino_id || treinoIdParam || null;
      } catch (e) {
        document.getElementById('lista-exercicios').innerHTML =
          '<div style="color:#444; font-size:13px; padding:12px 4px;">Erro ao carregar exercícios.</div>';
      }
    }

    function renderExercicios() {
      const lista = document.getElementById('lista-exercicios');
      lista.innerHTML = '';
      if (exerciciosCarregados.length === 0) {
        lista.innerHTML = '<div style="color:#444; font-size:13px; padding:12px 4px;">Nenhum exercício neste treino.</div>';
        return;
      }
      exerciciosCarregados.forEach((ex, i) => {
        const item = document.createElement('div');
        item.className = 'ex-item';
        item.id = `ex-${ex.nome}`;

        const concluido = exerciciosRegistrados[ex.nome];
        if (concluido) item.classList.add('concluido');

        item.innerHTML = `
          <div style="flex:1; cursor:pointer" onclick="abrirPopup(exerciciosCarregados[${i}])">
            <div class="ex-name">${ex.nome}</div>
            <div class="ex-meta">
              <div class="ex-tag"><strong>${ex.series}</strong> séries</div>
              <div class="ex-tag"><strong>${ex.carga}</strong> kg</div>
              <div class="ex-tag"><strong>${ex.repeticoes}</strong> reps</div>
            </div>
          </div>
          ${ehPersonalizado
            ? `<button class="btn-remover-ex" onclick="removerExercicio(event, ${i})">✕</button>`
            : `<div class="${concluido ? 'ex-check' : 'ex-arrow'}" id="arrow-${ex.nome}">${concluido ? '✓' : '›'}</div>`
          }
        `;
        lista.appendChild(item);
      });
    }

    async function removerExercicio(event, index) {
      event.stopPropagation();
      const ex = exerciciosCarregados[index];
      if (!confirm(`Remover "${ex.nome}" do treino?`)) return;

      try {
        const resp = await fetch(`${API}/exercicio/${treinoIdParam}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome: ex.nome })
        });
        const dados = await resp.json();
        if (dados.sucesso) {
          exerciciosCarregados.splice(index, 1);
          renderExercicios();
        }
      } catch (e) { alert('Erro ao remover exercício.'); }
    }

    // BUSCA CATÁLOGO
    async function carregarCatalogo() {
      try {
        const resp = await fetch(`${API}/catalogo`);
        catalogo = await resp.json();
        renderGrupos();
        renderResultados(catalogo);
      } catch (e) {}
    }

    function renderGrupos() {
      const grupos = ['Todos', ...new Set(catalogo.map(e => e.grupo))];
      const scroll = document.getElementById('grupos-scroll');
      scroll.innerHTML = '';
      grupos.forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'grupo-btn' + (g === grupoAtivo ? ' ativo' : '');
        btn.textContent = g;
        btn.onclick = () => { grupoAtivo = g; document.querySelectorAll('.grupo-btn').forEach(b => b.classList.remove('ativo')); btn.classList.add('ativo'); buscar(); };
        scroll.appendChild(btn);
      });
    }

    function buscar() {
      const termo = document.getElementById('campo-busca').value.toLowerCase();
      let filtrado = catalogo.filter(e => e.nome.toLowerCase().includes(termo));
      if (grupoAtivo !== 'Todos') filtrado = filtrado.filter(e => e.grupo === grupoAtivo);
      renderResultados(filtrado);
    }

    function renderResultados(lista) {
      const container = document.getElementById('resultados');
      container.innerHTML = '';
      if (lista.length === 0) {
        container.innerHTML = `<div class="vazio-busca">Nenhum exercício encontrado.</div>`;
        return;
      }
      lista.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'resultado-item';
        item.innerHTML = `<div><div class="resultado-nome">${ex.nome}</div><div class="resultado-grupo">${ex.grupo}</div></div><div class="resultado-plus">+</div>`;
        item.onclick = () => abrirConfigNovo(ex);
        container.appendChild(item);
      });
    }

    function abrirBusca() {
      document.getElementById('campo-busca').value = '';
      grupoAtivo = 'Todos';
      renderGrupos();
      renderResultados(catalogo);
      document.getElementById('overlay-busca').classList.add('aberto');
    }

    function fecharBusca(e) {
      if (!e || e.target === document.getElementById('overlay-busca')) {
        document.getElementById('overlay-busca').classList.remove('aberto');
      }
    }

    function abrirConfigNovo(ex) {
      exSelecionado = ex;
      document.getElementById('config-nome').textContent = ex.nome;
      document.getElementById('config-grupo').textContent = ex.grupo;
      document.getElementById('config-series').value = 3;
      document.getElementById('config-carga').value = 0;
      document.getElementById('config-reps').value = 12;
      document.getElementById('overlay-busca').classList.remove('aberto');
      document.getElementById('overlay-config').classList.add('aberto');
    }

    async function confirmarNovoExercicio() {
      const series = parseInt(document.getElementById('config-series').value) || 3;
      const carga = parseFloat(document.getElementById('config-carga').value) || 0;
      const reps = parseInt(document.getElementById('config-reps').value) || 12;

      try {
        const resp = await fetch(`${API}/exercicio`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ treino_id: treinoIdParam, nome: exSelecionado.nome, series, carga, repeticoes: reps })
        });
        const dados = await resp.json();
        if (dados.sucesso) {
          exerciciosCarregados.push({ nome: exSelecionado.nome, series, carga, repeticoes: reps, treino_id: parseInt(treinoIdParam) });
          document.getElementById('overlay-config').classList.remove('aberto');
          renderExercicios();
        }
      } catch (e) { alert('Erro ao adicionar exercício.'); }
    }

    // POPUP SÉRIES
    function abrirPopup(ex) {
      exAtual = ex;
      document.getElementById('popup-nome').textContent = ex.nome;
      document.getElementById('popup-ref-val').textContent = `${ex.series} séries · ${ex.carga}kg · ${ex.repeticoes} reps`;
      const container = document.getElementById('popup-series-container');
      container.innerHTML = '';
      const jaRegistrado = exerciciosRegistrados[ex.nome];
      for (let i = 1; i <= ex.series; i++) {
        const cargaVal = jaRegistrado ? jaRegistrado[i-1].carga : ex.carga;
        const repsVal = jaRegistrado ? jaRegistrado[i-1].repeticoes : ex.repeticoes;
        const row = document.createElement('div');
        row.className = 'serie-row';
        row.innerHTML = `<div class="serie-label">Série ${i}</div><div class="serie-inputs"><div class="input-wrap"><label>Carga (kg)</label><input type="number" id="carga-${i}" value="${cargaVal}" min="0" step="0.5" /></div><div class="input-wrap"><label>Repetições</label><input type="number" id="reps-${i}" value="${repsVal}" min="1" /></div></div>`;
        container.appendChild(row);
      }
      document.getElementById('overlay').classList.add('aberto');
    }

    function fecharPopup(e) {
      if (!e || e.target === document.getElementById('overlay')) {
        document.getElementById('overlay').classList.remove('aberto');
      }
    }

    function confirmarExercicio() {
      const series = [];
      for (let i = 1; i <= exAtual.series; i++) {
        series.push({ serie: i, carga: parseFloat(document.getElementById(`carga-${i}`).value) || exAtual.carga, repeticoes: parseInt(document.getElementById(`reps-${i}`).value) || exAtual.repeticoes });
      }
      exerciciosRegistrados[exAtual.nome] = series;
      const item = document.getElementById(`ex-${exAtual.nome}`);
      if (item && !ehPersonalizado) {
        item.classList.add('concluido');
        const arrow = document.getElementById(`arrow-${exAtual.nome}`);
        if (arrow) { arrow.textContent = '✓'; arrow.className = 'ex-check'; }
      }
      document.getElementById('overlay').classList.remove('aberto');
    }

    async function registrarTreino() {
      if (Object.keys(exerciciosRegistrados).length === 0) { alert('Registre pelo menos um exercício antes de salvar.'); return; }
      const exerciciosParaSalvar = Object.entries(exerciciosRegistrados).map(([nome, series]) => {
        const cargaMedia = series.reduce((s, r) => s + r.carga, 0) / series.length;
        const repsMedia = series.reduce((s, r) => s + r.repeticoes, 0) / series.length;
        return { nome, series: series.length, carga: parseFloat(cargaMedia.toFixed(1)), repeticoes: Math.round(repsMedia) };
      });
      try {
        const resp = await fetch(`${API}/historico`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario_id: id, treino_id: treinoId, exercicios: exerciciosParaSalvar }) });
        const dados = await resp.json();
        if (dados.sucesso) {
          const msg = document.getElementById('sucesso-msg');
          msg.style.display = 'block';
          setTimeout(() => { msg.style.display = 'none'; window.location.href = 'home.html'; }, 2000);
        }
      } catch (e) { alert('Erro ao registrar treino.'); }
    }

    carregarExercicios();
    if (ehPersonalizado) carregarCatalogo();
  </script>
</body>
</html>
