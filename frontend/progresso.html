<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitCode — Progresso</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080808; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Barlow', sans-serif; }
    .phone { width: 380px; min-height: 780px; background: #0d0d0d; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; padding: 32px 0 32px; border: 1.5px solid #1e1e1e; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 0 24px 20px; }
    .back-btn { width: 36px; height: 36px; border-radius: 10px; background: #141414; border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; cursor: pointer; text-decoration: none; }
    .screen-title { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: #fff; }
    .content { padding: 0 20px; flex: 1; overflow-y: auto; }
    .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: #444; margin-bottom: 12px; }
    .ex-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .ex-btn { padding: 7px 14px; background: #141414; border: 1px solid #222; border-radius: 20px; font-size: 12px; color: #666; cursor: pointer; transition: all 0.2s; }
    .ex-btn.ativo { background: #E8400020; border-color: #E84000; color: #E84000; }
    .chart-card { background: #111; border: 1px solid #1e1e1e; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .chart-title { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .chart-sub { font-size: 11px; color: #444; margin-bottom: 14px; }
    .historico-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .historico-item { background: #111; border: 1px solid #1e1e1e; border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .hist-data { font-size: 11px; color: #555; margin-bottom: 3px; }
    .hist-nome { font-size: 14px; font-weight: 600; color: #ddd; }
    .hist-carga { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #E84000; }
    .hist-unit { font-size: 10px; color: #555; }
    .vazio { font-size: 13px; color: #444; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <a class="back-btn" href="treino.html">←</a>
      <div class="screen-title">Progresso</div>
    </div>

    <div class="content">
      <div class="section-label">Selecione o exercício</div>
      <div class="ex-selector" id="ex-selector"></div>

      <div class="chart-card" id="chart-card" style="display:none">
        <div class="chart-title" id="chart-title">—</div>
        <div class="chart-sub">Evolução da carga (kg)</div>
        <canvas id="meuChart" height="160"></canvas>
      </div>

      <div class="section-label" id="label-historico" style="display:none">Histórico de registros</div>
      <div class="historico-lista" id="historico-lista"></div>

      <div class="vazio" id="vazio">Registre treinos para ver seu progresso aqui.</div>
    </div>
  </div>

  <script>
    const treinoFiltro = new URLSearchParams(window.location.search).get('treino');
    const id = localStorage.getItem('usuario_id');
    if (!id) window.location.href = 'index.html';

    let historico = {};
    let chartInstance = null;

    async function carregarHistorico() {
      try {
        const resp = await fetch(`http://localhost:5000/historico/${id}?treino=${treinoFiltro || ''}`);
        historico = await resp.json();

        const exercicios = Object.keys(historico);

        if (exercicios.length === 0) {
          document.getElementById('vazio').style.display = 'block';
          return;
        }

        document.getElementById('vazio').style.display = 'none';

        const selector = document.getElementById('ex-selector');
        selector.innerHTML = '';

        exercicios.forEach((nome, i) => {
          const btn = document.createElement('button');
          btn.className = 'ex-btn' + (i === 0 ? ' ativo' : '');
          btn.textContent = nome;
          btn.onclick = () => selecionarExercicio(nome, btn);
          selector.appendChild(btn);
        });

        selecionarExercicio(exercicios[0], selector.children[0]);
      } catch (e) {
        document.getElementById('vazio').textContent = 'Erro ao carregar histórico.';
      }
    }

    function selecionarExercicio(nome, btnClicado) {
      document.querySelectorAll('.ex-btn').forEach(b => b.classList.remove('ativo'));
      btnClicado.classList.add('ativo');

      const dados = historico[nome];
      const invertido = [...dados].reverse();

      document.getElementById('chart-card').style.display = 'block';
      document.getElementById('chart-title').textContent = nome;
      document.getElementById('label-historico').style.display = 'block';

      const labels = invertido.map(d => d.data);
      const cargas = invertido.map(d => d.carga);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('meuChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: cargas,
            borderColor: '#E84000',
            backgroundColor: '#E8400020',
            borderWidth: 2,
            pointBackgroundColor: '#E84000',
            pointRadius: 5,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#555', font: { size: 10 } }, grid: { color: '#1a1a1a' } },
            y: { ticks: { color: '#555', font: { size: 10 } }, grid: { color: '#1a1a1a' } }
          }
        }
      });

      const lista = document.getElementById('historico-lista');
      lista.innerHTML = '';
      dados.forEach(d => {
        const item = document.createElement('div');
        item.className = 'historico-item';
        item.innerHTML = `
          <div>
            <div class="hist-data">${d.data} — ${d.treino}</div>
            <div class="hist-nome">${d.series} séries × ${d.repeticoes} reps</div>
          </div>
          <div>
            <div class="hist-carga">${d.carga}</div>
            <div class="hist-unit">kg</div>
          </div>
        `;
        lista.appendChild(item);
      });
    }

    carregarHistorico();
  </script>
</body>
</html>
