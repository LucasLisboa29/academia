<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitCode — Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow', sans-serif;
    }

    .phone {
      width: 380px;
      min-height: 780px;
      background: #0d0d0d;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 32px 0 32px;
      border: 1.5px solid #1e1e1e;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 16px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #E84000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }

    .streak {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #141414;
      border: 1px solid #222;
      border-radius: 24px;
      padding: 8px 14px;
    }

    .streak-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #F5A623;
    }

    .streak-label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .greeting {
      padding: 0 24px 20px;
    }

    .greeting-sub {
      font-size: 11px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 2px;
    }

    .greeting-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #fff;
    }

    .aviso-card {
      margin: 0 20px 20px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 3px solid #E84000;
      border-radius: 12px;
      padding: 14px 16px;
    }

    .aviso-top {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #E84000;
      margin-bottom: 5px;
    }

    .aviso-text {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      min-height: 20px;
    }

    .section-title {
      padding: 0 24px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #444;
    }

    .treinos-grid {
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .treino-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 14px;
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .treino-card:hover {
      border-color: #E8400050;
      background: #1a0f0a;
    }

    .treino-letter {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #E84000;
    }

    .treino-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
    }

    .btn-criar {
      margin: 0 20px;
      height: 48px;
      background: transparent;
      border: 1px dashed #2a2a2a;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-criar:hover {
      border-color: #E8400050;
      color: #E84000;
    }

    .btn-criar .plus {
      font-size: 20px;
      color: #E84000;
    }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <div class="phone">
    <div class="header">
      <a class="avatar" href="perfil.html" id="avatar-initials">?</a>
      <div class="streak">
        <span>🔥</span>
        <span class="streak-num" id="streak-num">0</span>
        <span class="streak-label">dias</span>
      </div>
    </div>

    <div class="greeting">
      <div class="greeting-sub">Bem-vindo de volta</div>
      <div class="greeting-name" id="nome-usuario">Carregando...</div>
    </div>

    <div class="aviso-card">
      <div class="aviso-top">Aviso da academia</div>
      <div class="aviso-text" id="aviso-texto">Carregando avisos...</div>
    </div>

    <div class="section-title">Seus treinos</div>

    <div class="treinos-grid">
      <a class="treino-card" href="treino.html?treino=A">
        <div class="treino-letter">A</div>
        <div class="treino-label">Treino A</div>
      </a>
      <a class="treino-card" href="treino.html?treino=B">
        <div class="treino-letter">B</div>
        <div class="treino-label">Treino B</div>
      </a>
      <a class="treino-card" href="treino.html?treino=C">
        <div class="treino-letter">C</div>
        <div class="treino-label">Treino C</div>
      </a>
    </div>

    <div class="section-title" id="label-meus-treinos" style="display:none">Meus treinos</div>
    <div id="meus-treinos-lista" style="padding: 0 16px; display:flex; flex-direction:column; gap:8px; margin-bottom:12px;"></div>

    <a class="btn-criar" href="adicionar_treino.html">
      <span class="plus">+</span> Crie seu próprio treino
    </a>
  </div>

  <script>
    const nome = localStorage.getItem('usuario_nome') || 'Usuário';
    const id = localStorage.getItem('usuario_id');

    if (!id) window.location.href = 'index.html';

    const iniciais = nome.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
    document.getElementById('avatar-initials').textContent = iniciais;
    document.getElementById('nome-usuario').textContent = nome;

    async function carregarDados() {
      try {
        const resp = await fetch(`${API}/usuario/${id}`);
        const dados = await resp.json();
        document.getElementById('streak-num').textContent = dados.frequencia || 0;
      } catch (e) {}

      try {
        const resp = await fetch('${API}/avisos');
        const dados = await resp.json();
        if (dados.length > 0) {
          document.getElementById('aviso-texto').textContent = dados[0].mensagem;
        } else {
          document.getElementById('aviso-texto').textContent = 'Nenhum aviso no momento.';
        }
      } catch (e) {
        document.getElementById('aviso-texto').textContent = 'Nenhum aviso no momento.';
      }
    }

    async function carregarMeusTreinos() {
        try {
            const resp = await fetch(`${API}/meus_treinos/${id}`);
            const treinos = await resp.json();

            if (treinos.length === 0) return;

            document.getElementById('label-meus-treinos').style.display = 'block';
            const lista = document.getElementById('meus-treinos-lista');
            lista.innerHTML = '';

            treinos.forEach(t => {
                const card = document.createElement('a');
                card.href = `treino.html?treino_id=${t.id}`;
                card.style.cssText = `
                    background: #111; border: 1px solid #1e1e1e; border-radius: 14px;
                    padding: 14px 18px; display: flex; align-items: center;
                    justify-content: space-between; cursor: pointer;
                    text-decoration: none; transition: border-color 0.2s;
                `;
                card.innerHTML = `
                    <div>
                        <div style="font-size:13px; font-weight:600; color:#ddd;">${t.nome}</div>
                        <div style="font-size:10px; color:#555; text-transform:uppercase; letter-spacing:0.08em; margin-top:3px;">Treino personalizado</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="color:#333; font-size:22px;">›</span>
                        <span onclick="apagarTreino(event, ${t.id})" style="color:#333; font-size:18px; cursor:pointer; padding:4px;">🗑</span>
                    </div>
                `;
                lista.appendChild(card);
            });
        } catch (e) {}
    }

    async function apagarTreino(event, treinoId) {
        event.preventDefault();
        if (!confirm('Apagar este treino?')) return;
        try {
            const resp = await fetch(`${API}/treinos/${treinoId}`, {
                method: 'DELETE'
            });
            const dados = await resp.json();
            if (dados.sucesso) carregarMeusTreinos();
        } catch (e) { alert('Erro ao apagar treino.'); }
    }

    carregarDados();
    carregarMeusTreinos();

  </script>
</body>
</html>
